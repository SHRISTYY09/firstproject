<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add New Student | NIACT</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f9ff;
      padding: 40px;
    }

    .form-container {
      background-color: white;
      max-width: 600px;
      margin: auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 25px;
      background-color: #3498db;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }

    button:hover {
      background-color: #2980b9;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #3498db;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Add New Student</h2>
    <form>
      <label for="roll">Roll Number</label>
      <input type="text" id="roll" name="roll" required>

      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="course">Course Enrolled</label>
      <input type="text" id="course" name="course" required>

      <label for="topics">Topics Covered</label>
      <textarea id="topics" name="topics" rows="3"></textarea>

      <label for="status">Status</label>
      <select id="status" name="status">
        <option value="Completed"> Completed</option>
        <option value="In Progress"> In Progress</option>
      </select>
 
      <button type="submit">Submit Student Details</button>
    </form>
    <a href="batch1.html" class="back-link">⬅ Back to Batch 1</a>
  </div>
</body>
</html>
